<div class="grid min-h-screen place-items-center p-6">
  <div class="w-full max-w-[480px]">
    <div class="mb-7 flex items-center justify-center gap-2 font-bold tracking-tight">
      <i class="size-[22px] rounded-md bg-accent"></i>Trilha
    </div>
    <div class="card">
      <h1>Entrar</h1>
      <p class="mt-1 text-muted">Acesse sua conta para continuar aprendendo.</p>
      <form class="mt-5 grid gap-4" (submit)="$event.preventDefault()">
        <label class="grid gap-1.5 text-sm font-medium"
          ><span>E-mail</span><input type="email" autocomplete="email" placeholder="voce@email.com"
        /></label>
        <label class="grid gap-1.5 text-sm font-medium"
          ><span>Senha</span><input type="password" autocomplete="current-password"
        /></label>
        <a class="btn w-full" routerLink="/dashboard">Entrar</a>
      </form>
    </div>
    <p class="mt-5 text-center text-sm text-muted">
      Ainda não tem conta? <a routerLink="/cadastro">Criar conta</a>
    </p>
  </div>
</div>
